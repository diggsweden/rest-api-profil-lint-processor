name: OpenSSF Scorecard Analysis
on:
  schedule:
    # Saturdays at 02:20 UTC
    - cron: '20 2 * * 6'
    # Wednesdays at 02:20 UTC
    - cron: '20 2 * * 3'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scorecard-analysis:
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: diggsweden/reusable-ci/.github/workflows/security-openssf-scorecard.yml@4e656557f4fa8ba4ea8ec388eda0e23914ceae7f # v2.7.7
    with:
      publish-results: true
