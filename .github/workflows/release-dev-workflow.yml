# Release Workflow Dev
#
# Triggers dev builds for testing on development branches.
# Creates:
# - Dev container image (ghcr.io)
# - Dev NPM package (GitHub Packages)
#
# Triggers:
# - Push to dev/* or feat/* branches
# - Manual workflow dispatch
#
# Created artifacts:
# - NPM package: @diggsweden/rest-api-profil-linter-citest@0.5.9-dev-feat-name-abc1234
# - Container image: ghcr.io/diggsweden/rest-api-profil-linter-citest:0.5.9-dev-feat-name-abc1234
# - Tagged with 'dev' (not 'latest')
name: Release Workflow Dev
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dev-release:
    permissions:
      contents: read
      packages: write
    uses: diggsweden/reusable-ci/.github/workflows/release-dev-orchestrator.yml@2afbedbefbb457a5fc6175de232e4644cab58a69 # v2.7.3
    with:
      reusable-ci-ref: v2.7.3
      project-type: npm
      package-scope: '@diggsweden'
    secrets: inherit
