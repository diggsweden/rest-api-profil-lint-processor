openapi: 3.1.0

info:
  title: REST API Profile - Traceability and correlation example
  version: 1.0.0
  summary: Example API demonstrating correct implementation of rules for traceability and correlation.
  description: |
    ## English

    These are deliberately simple reference examples for the chapter "Traceability and correlation" in the Swedish REST API Profile. They are not intended to represent a complete production API.

    SPA.04:
    The producer of the API SHOULD include the HTTP traceparent header in the response.

    Examples 1-2 show a traceparent header returned by the API, defined directly as a Header Object and via $ref.

    SPA.07:
    Alternative identifiers, such as x-request-id, MAY be used as a complement for internal needs, but SHALL NOT replace traceparent when tracing API calls between systems and organisations.

    Examples 3-4 show x-request-id used together with traceparent as request headers, defined inline on operation level and via $ref on path level.

    ## Svenska

    Dessa är avsiktligt förenklade referensexempel för kapitlet "Spårbarhet och korrelation" i den svenska REST API-profilen. De är inte avsedda att representera ett komplett produktions-API.

    SPA.04:
    API-producenten BÖR inkludera HTTP-headern traceparent i ett API-svar.

    Exempel 1-2 visar en traceparent-header som returneras av API:et, definierad direkt som Header Object och via $ref.

    SPA.07:
    Alternativa identifierare, såsom x-request-id, KAN användas som komplement för interna behov, men SKALL INTE ersätta traceparent vid spårning av API-anrop mellan system och organisationer.

    Exempel 3-4 visar x-request-id som används tillsammans med traceparent som request-headers, definierade inline på operationsnivå och via $ref på path-nivå.

servers:
  - url: https://api.example.se

paths:
  # Example 1: Traceparent defined directly as a Header Object // Exempel 1: Traceparent definieras direkt som Header Object
  /orders/{orderId}:
    get:
      summary: Get an order.
      operationId: getOrder

      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          example: '12345'

      responses:
        '200':
          description: Order returned successfully.
          headers:
            traceparent:
              description: The traceparent header defined by W3C Trace Context.
              schema:
                type: string

          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                  status:
                    type: string
                required:
                  - orderId
                  - status

  # Example 2: Traceparent defined via $ref // Exempel 2: Traceparent definieras via $ref
  /customers/{customerId}:
    get:
      summary: Get a customer.
      operationId: getCustomer

      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          example: '12345'

      responses:
        '200':
          description: Customer returned successfully.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'

          content:
            application/json:
              schema:
                type: object
                properties:
                  customerId:
                    type: string
                  name:
                    type: string
                required:
                  - customerId
                  - name

  # Example 3: x-request-id and traceparent defined inline on operation level // Exempel 3: x-request-id och traceparent definieras inline på operationsnivå
  /orders:
    get:
      summary: List orders.
      operationId: listOrders

      parameters:
        - name: traceparent
          in: header
          required: true
          description: The traceparent header defined by W3C Trace Context.
          schema:
            type: string
          example: '00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01'
        - name: x-request-id
          in: header
          required: false
          description: Alternative identifier for internal needs, used as a complement to traceparent.
          schema:
            type: string
          example: '9f47c1fd-2c6a-4f77-8d1b-c8a927e3f9d1'

      responses:
        '200':
          description: Orders returned successfully.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'

          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    orderId:
                      type: string
                    status:
                      type: string
                  required:
                    - orderId
                    - status

  # Example 4: x-request-id and traceparent defined via $ref on path level // Exempel 4: x-request-id och traceparent definieras via $ref på path-nivå
  /customers:
    parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/XRequestId'

    get:
      summary: List customers.
      operationId: listCustomers

      responses:
        '200':
          description: Customers returned successfully.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'

          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    customerId:
                      type: string
                    name:
                      type: string
                  required:
                    - customerId
                    - name

components:
  headers:
    Traceparent:
      description: |
        The traceparent header defined by W3C Trace Context and returned by the API.
      schema:
        type: string

  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: true
      description: The traceparent header defined by W3C Trace Context.
      schema:
        type: string
      example: '00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01'

    XRequestId:
      name: x-request-id
      in: header
      required: false
      description: Alternative identifier for internal needs, used as a complement to traceparent.
      schema:
        type: string
      example: '9f47c1fd-2c6a-4f77-8d1b-c8a927e3f9d1'
