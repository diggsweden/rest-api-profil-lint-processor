openapi: 3.1.0

info:
  title: REST API Profile - Traceability and correlation example
  version: 1.0.0
  summary: Example API demonstrating correct implementation of rules for traceability and correlation.
  description: |
    This is a deliberately simple reference example for the chapter "Traceability and correlation" in the Swedish REST API Profile.

    SPA.04:
    The producer of the API SHOULD include the HTTP traceparent header in the response.

    The example shows a traceparent header returned by the API.

    This example is intentionally simplified and is not intended to represent a complete production API.

    Detta är ett avsiktligt förenklat referensexempel för kapitlet "Spårbarhet och korrelation" i den svenska REST API-profilen.

    SPA.04:
    API-producenten BÖR inkludera HTTP-headern traceparent i ett API-svar.

    Exemplet visar en traceparent-header som returneras av API:et.

    Exemplet är avsiktligt förenklat och är inte avsett att representera ett komplett produktions-API.

servers:
  - url: https://api.example.se

paths:
  # Example 1: Traceparent defined directly as a Header Object // Exempel 1: Traceparent definieras direkt som Header Object
  /orders/{orderId}:
    get:
      summary: Get an order.
      operationId: getOrder

      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          example: '12345'

      responses:
        '200':
          description: Order returned successfully.
          headers:
            traceparent:
              description: The traceparent header defined by W3C Trace Context.
              schema:
                type: string

          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                  status:
                    type: string
                required:
                  - orderId
                  - status

  # Example 2: Traceparent defined via $ref // Traceparent definieras via $ref
  /customers/{customerId}:
    get:
      summary: Get a customer.
      operationId: getCustomer

      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          example: '12345'

      responses:
        '200':
          description: Customer returned successfully.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'

          content:
            application/json:
              schema:
                type: object
                properties:
                  customerId:
                    type: string
                  name:
                    type: string
                required:
                  - customerId
                  - name

    put:
      summary: Uppdatera organisation
      description: |
        SPA.07 - x-request-id anges inline medan traceparent hämtas från
        components.parameters. Blandade former är likvärdiga för regeln.
      operationId: updateOrganisation
      parameters:
        - name: x-request-id
          in: header
          required: false
          description: Alternativ intern identifierare, komplement till traceparent.
          schema:
            type: string
            format: uuid
            example: '9f47c1fd-2c6a-4f77-8d1b-c8a927e3f9d1'
        - $ref: '#/components/parameters/TraceParent'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organisation'

      responses:
        '200':
          description: Organisation uppdaterad

          headers:
            traceparent:
              $ref: '#/components/headers/TraceParent'

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'

  /organisationer:
    parameters:
      - $ref: '#/components/parameters/TraceParent'
      - $ref: '#/components/parameters/XRequestId'

    get:
      summary: Lista organisationer
      description: |
        SPA.07 - x-request-id används som internt komplement och ersätter
        alltså inte traceparent. Båda headers är definierade på path-nivå.
      operationId: listOrganisationer
      responses:
        '200':
          description: Lista med organisationer

          headers:
            traceparent:
              $ref: '#/components/headers/TraceParent'

          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organisation'

    post:
      summary: Skapa organisation
      description: |
        SPA.07 - ärver traceparent och x-request-id från path-nivån.
      operationId: createOrganisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organisation'

      responses:
        '201':
          description: Organisation skapad

          headers:
            traceparent:
              $ref: '#/components/headers/TraceParent'

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'

components:
  headers:
    Traceparent:
      description: |
        The traceparent header defined by W3C Trace Context and returned by the API.
      schema:
        type: string
