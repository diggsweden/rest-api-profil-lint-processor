openapi: 3.1.0

info:
  title: REST API Profile - Traceability and correlation example
  version: 1.0.0
  summary: Example API demonstrating correct implementation of rules for traceability and correlation.
  description: |
    This is a deliberately simple reference example for the chapter "Traceability and correlation" in the Swedish REST API Profile.

    SPA.02:
    The API producer MUST accept the HTTP traceparent header in incoming requests and propagate the trace information according to W3C Trace Context when making subsequent requests to other systems.

    The example shows a traceparent header accepted by the API, defined either directly on an operation, on path level, or via a reference to components.parameters.

    SPA.02:
    API-producenten SKALL acceptera HTTP-headern traceparent i inkommande anrop och propagera spårningsinformationen vidare enligt W3C Trace Context vid vidare anrop till andra system.

    Exemplet visar en traceparent-header som accepteras av API:et, definierad antingen direkt på en operation, på path-nivå eller via en referens till components.parameters.
    
    SPA.04:
    The producer of the API SHOULD include the HTTP traceparent header in the response.

    The example shows a traceparent header returned by the API.

    This example is intentionally simplified and is not intended to represent a complete production API.

    Detta är ett avsiktligt förenklat referensexempel för kapitlet "Spårbarhet och korrelation" i den svenska REST API-profilen.

    SPA.04:
    API-producenten BÖR inkludera HTTP-headern traceparent i ett API-svar.

    Exemplet visar en traceparent-header som returneras av API:et.

    Exemplet är avsiktligt förenklat och är inte avsett att representera ett komplett produktions-API.

servers:
  - url: https://api.example.se

paths:
  # Example 1: Traceparent defined directly as a Header Object // Exempel 1: Traceparent definieras direkt som Header Object
  /orders/{orderId}:
    get:
      summary: Get an order.
      operationId: getOrder

      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          example: '12345'

        - name: traceparent
          in: header
          required: false
          schema:
            type: string

      responses:
        '200':
          description: Order returned successfully.
          headers:
            traceparent:
              description: The traceparent header defined by W3C Trace Context.
              schema:
                type: string

          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                  status:
                    type: string
                required:
                  - orderId
                  - status

  # Example 2: Traceparent defined via $ref // Exempel 2: Traceparent definieras via $ref
  /customers/{customerId}:
    get:
      summary: Get a customer.
      operationId: getCustomer

      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
          example: '12345'

        - $ref: '#/components/parameters/Traceparent'

      responses:
        '200':
          description: Customer returned successfully.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'

          content:
            application/json:
              schema:
                type: object
                properties:
                  customerId:
                    type: string
                  name:
                    type: string
                required:
                  - customerId
                  - name

  # Example 3: Traceparent defined on path level // Exempel 3: Traceparent definieras på path-nivå
  /organisations/{organisationId}:
    parameters:
      - name: traceparent
        in: header
        required: false
        schema:
          type: string

    get:
      summary: Get an organisation.
      operationId: getOrganisation

      parameters:
        - name: organisationId
          in: path
          required: true
          schema:
            type: string
          example: '12345'

      responses:
        '200':
          description: Organisation returned successfully.
          headers:
            traceparent:
              description: The traceparent header defined by W3C Trace Context.
              schema:
                type: string

          content:
            application/json:
              schema:
                type: object
                properties:
                  organisationId:
                    type: string
                  name:
                    type: string
                required:
                  - organisationId
                  - name

components:
  headers:
    Traceparent:
      description: |
        The traceparent header defined by W3C Trace Context and returned by the API.
      schema:
        type: string

  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: |
        The traceparent header defined by W3C Trace Context.
      schema:
        type: string
