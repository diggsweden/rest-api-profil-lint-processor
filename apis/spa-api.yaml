openapi: 3.1.0

info:
  title: REST API Profile - Traceability and correlation example
  version: 1.0.0
  summary: Example API demonstrating correct implementation of rules for traceability and correlation.
  description: |
    This is a deliberately simple reference example for the chapter "Traceability and correlation" in the Swedish REST API Profile.

    SPA.04:
    The producer of the API SHOULD include the HTTP traceparent header in the response.

    The example shows a traceparent header returned by the API.

    This example is intentionally simplified and is not intended to represent a complete production API.

    Detta är ett avsiktligt förenklat referensexempel för kapitlet "Spårbarhet och korrelation" i den svenska REST API-profilen.

    SPA.04:
    API-producenten BÖR inkludera HTTP-headern traceparent i ett API-svar.

    Exemplet visar en traceparent-header som returneras av API:et.

    Exemplet är avsiktligt förenklat och är inte avsett att representera ett komplett produktions-API.

servers:
  - url: https://api.example.se

paths:
  /orders/{orderId}:
    get:
      summary: Get an order.
      operationId: getOrder

      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          example: '12345'

      responses:
        '200':
          description: Order returned successfully.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'

          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                  status:
                    type: string
                required:
                  - orderId
                  - status

components:
  headers:
    Traceparent:
      description: |
        The traceparent header defined by W3C Trace Context and returned by the API.
      schema:
        type: string
