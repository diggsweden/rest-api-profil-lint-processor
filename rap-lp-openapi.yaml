openapi: 3.1.0
info:
  title: RAP-LP API
  version: 1.0.1
  x-api-released: '2026-10-28'
  x-api-status: active
  summary: API for validating OpenAPI specifications against the Swedish REST API profile.
  description: |
    RAP-LP (REST API-profil Lint Processor) validates an OpenAPI specification against
    the national REST API profile and additional RAP-LP design rules.
    RAP-LP validates structure, semantics and design rules, and can also generate an
    Excel report from a precomputed validation report.
    This specification describes the linter API itself.

    Limitations: URL-based validation may be disabled via server configuration and generate-report returns a binary Excel file while other resources return JSON.

    RAP-LP (REST API-profil Lint Processor) validerar en OpenAPI-specifikation mot den nationella REST API-profilen och ytterligare RAP-LP-designregler.
    RAP-LP validerar struktur, semantik och designregler, och kan även generera en Excel-rapport från en förberäknad valideringsrapport.
    Denna specifikation beskriver själva linter API:et.

    Begränsningar: URL-baserad validering kan vara avstängd via serverkonfiguration,
    och generate-report returnerar en binär Excel-fil medan övriga resurser returnerar JSON.
  contact:
    name: REST API-profil Lint Processor
    url: https://raplp.digg.se/
    email: raplp-maintenance@digg.se
  license:
    name: EUPL-1.2
    url: https://joinup.ec.europa.eu/collection/eupl/eupl-text-eupl-12
externalDocs:
  description: RAP-LP API documentation
  url: https://github.com/diggsweden/rest-api-profil-lint-processor/blob/main/README.md#api-l%C3%A4ge
servers:
  - url: 'https://{host}/api/v1/'
    description: RAP-LP API. Defaults to production. Set host to target your environment.
    variables:
      host:
        default: raplp.digg.se
tags:
  - name: validation
    description: Operations for validating OpenAPI specifications and generating reports.
  - name: metadata
    description: Operations for API metadata and available rule categories.
  - name: statistics
    description: Usage statistics. Statistics are disabled by default; when disabled, these endpoints respond with enabled false and empty data.
  - name: operations
    description: Operational endpoints for health checks and monitoring. Served from the root path, outside the versioned API base path.
security: []
paths:
  /validation/rules:
    get:
      tags:
        - metadata
      summary: List available rule categories.
      description: Returns the available rule categories that can be supplied when validating a specification.
      operationId: listValidationRules
      responses:
        '200':
          description: Available rule categories were returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRules'
              examples:
                default:
                  value:
                    - rule: UfnRules
                      description: URL format och namngivning
                    - rule: DokRules
                      description: Dokumentation
                    - rule: AmeRules
                      description: API Message
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                internalServerError:
                  value:
                    type: https://raplp.digg.se/problems/internal-server-error
                    title: Internt serverfel
                    status: 500
                    detail: Ett ovantat fel intraffade.
                    instance: /api/v1/validation/rules
  /api-info:
    get:
      tags:
        - metadata
      summary: Get API information.
      description: Returns name, semantic version, release date, documentation URL and lifecycle status for the RAP-LP API.
      operationId: getApiInfo
      responses:
        '200':
          description: API information was returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInfo'
              examples:
                default:
                  value:
                    apiName: RAP-LP API
                    apiVersion: 1.2.3
                    apiReleased: '2026-12-24'
                    apiDocumentation: https://raplp.digg.se/api/v1/docs
                    apiStatus: active
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                internalServerError:
                  value:
                    type: https://raplp.digg.se/problems/internal-server-error
                    title: Internt serverfel
                    status: 500
                    detail: Ett ovantat fel intraffade.
                    instance: /api/v1/api-info
  /validation/validatespec:
    post:
      tags:
        - validation
      summary: Validate an OpenAPI specification.
      description: |
        Validates a base64-encoded OpenAPI specification.

        The service first performs parsing and strict validation of structural and semantic errors.
        If no strict issues are found, RAP-LP rule validation is executed for the selected rule categories.
      operationId: validateSpec
      requestBody:
        required: true
        description: Base64-encoded specification and optional validation settings.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecValidationRequest'
            examples:
              yamlSpecification:
                value:
                  spec: b3BlbmFwaTogMy4xLjAKaW5mbzoKICB0aXRsZTogRXhhbXBsZQogIHZlcnNpb246IDEuMC4wCnBhdGhzOiB7fQo=
                  strict: true
                  categories:
                    - DokRules
                    - UfnRules
      responses:
        '200':
          description: Validation completed without rule violations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulValidationResponse'
              examples:
                success:
                  value:
                    ok: true
                    stage: rule-engine
                    format: yaml
                    payload:
                      result: []
                      report:
                        - note: Godkända regler - RAP-LP
                          rules:
                            - id: DOK.03
                              area: Dokumentation
                              status: OK
        '400':
          description: The specification was invalid or violated one or more rules.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
              examples:
                missingSpec:
                  value:
                    type: https://raplp.digg.se/problems/bad-request
                    title: Invalid Request
                    status: 400
                    detail: 'Required field missing: spec'
                    instance: /api/v1/validation/validatespec
                specValidation:
                  value:
                    type: https://raplp.digg.se/problems/semantic-validation
                    title: Rule validation failed
                    status: 400
                    detail: Specifikationen innehåller strukturella eller semantiska fel
                    instance: /api/v1/validation/validatespec
                    kind: spec-validation
                    stage: strict
                    format: yaml
                    issues:
                      - code: parser-error
                        message: Missing required property paths.
                        severity: error
                        path:
                          - paths
                    snippet: |
                      line 12: missing required property: paths
                ruleValidation:
                  value:
                    type: https://raplp.digg.se/problems/rule-validation
                    title: Rule validation failed
                    status: 400
                    detail: API-specifikationen bryter mot en eller flera regler enligt den svenska REST API-profilen.
                    instance: /api/v1/validation/validatespec
                    kind: rule-validation
                    stage: rule-engine
                    format: yaml
                    payload:
                      result:
                        - id: AME.04
                          area: API Message
                          requirement: För fältnamn i request och response body BÖR camelCase eller snake_case notation användas.
                          severity: WARNING
                          path:
                            - components
                            - schemas
                            - Example
                            - properties
                            - problemField
                          range:
                            start:
                              line: 10
                              character: 8
                            end:
                              line: 10
                              character: 20
                      report:
                        - note: Ej godkända regler - RAP-LP
                          rules:
                            - id: AME.04
                              area: API Message
                              status: EJ OK
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                internalServerError:
                  value:
                    type: https://raplp.digg.se/problems/internal-server-error
                    title: Internt serverfel
                    status: 500
                    detail: Ett ovantat fel intraffade.
                    instance: /api/v1/validation/validatespec
  /validation/url:
    post:
      tags:
        - validation
      summary: Validate a remotely hosted OpenAPI specification.
      description: |
        Fetches an OpenAPI specification from a remote URL and validates it.

        Redirects are not allowed. The requested URL is checked before fetching,
        then the downloaded OpenAPI document is parsed and strictly validated before
        RAP-LP rule validation is executed.

        This feature can be disabled by server configuration. When disabled, the API returns 409 Conflict.
      operationId: validateUrl
      requestBody:
        required: true
        description: Remote URL to the OpenAPI specification and optional validation settings.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrlValidationRequest'
            examples:
              remoteSpecification:
                value:
                  url: https://api.example.se/foretagsinformation/v2/openapi.yaml
                  strict: true
                  categories:
                    - DokRules
                    - UfnRules
      responses:
        '200':
          description: Validation completed without rule violations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlValidationSuccessResponse'
              examples:
                success:
                  value:
                    ok: true
                    stage: rule-engine
                    format: yaml
                    payload:
                      result: []
                      report:
                        - note: Godkända regler - RAP-LP
                          rules:
                            - id: DOK.03
                              area: Dokumentation
                              status: OK
        '400':
          description: Invalid request, invalid URL, invalid remote response, strict validation error or rule validation error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
              examples:
                missingUrl:
                  value:
                    type: https://raplp.digg.se/problems/bad-request
                    title: Invalid Request
                    status: 400
                    detail: 'Required field missing: url'
                    instance: /api/v1/validation/url
                urlPatternRejected:
                  value:
                    type: https://raplp.digg.se/problems/bad-request
                    title: Invalid Request
                    status: 400
                    detail: The requested address did not meet the allowed URL pattern. Please contact your administrator if you believe this is a mistake.
                    instance: /api/v1/validation/url
                invalidUrlFormat:
                  value:
                    type: https://raplp.digg.se/problems/bad-request
                    title: Invalid Request
                    status: 400
                    detail: Invalid URL format.
                    instance: /api/v1/validation/url
                invalidProtocol:
                  value:
                    type: https://raplp.digg.se/problems/bad-request
                    title: Invalid Request
                    status: 400
                    detail: Only HTTPS and HTTP protocols are allowed.
                    instance: /api/v1/validation/url
                urlFetchFailed:
                  value:
                    type: https://raplp.digg.se/problems/bad-request
                    title: Invalid Request
                    status: 400
                    detail: The requested URL could not be retrieved. Redirects are not allowed.
                    instance: /api/v1/validation/url
                remoteHttpError:
                  value:
                    type: https://raplp.digg.se/problems/bad-request
                    title: Invalid Request
                    status: 400
                    detail: The requested URL returned HTTP 404.
                    instance: /api/v1/validation/url
                specValidation:
                  value:
                    type: https://raplp.digg.se/problems/semantic-validation
                    title: Rule validation failed
                    status: 400
                    detail: Specifikationen innehåller strukturella eller semantiska fel
                    instance: /api/v1/validation/url
                    kind: spec-validation
                    stage: strict
                    format: yaml
                    issues:
                      - code: parser-error
                        message: Missing required property paths.
                        severity: error
                        path:
                          - paths
                    snippet: |
                      line 12: missing required property: paths
                ruleValidation:
                  value:
                    type: https://raplp.digg.se/problems/rule-validation
                    title: Rule validation failed
                    status: 400
                    detail: API-specifikationen bryter mot en eller flera regler enligt den svenska REST API-profilen.
                    instance: /api/v1/validation/url
                    kind: rule-validation
                    stage: rule-engine
                    format: yaml
                    payload:
                      result:
                        - id: AME.04
                          area: API Message
                          requirement: För fältnamn i request och response body BÖR camelCase eller snake_case notation användas.
                          severity: WARNING
                          path:
                            - components
                            - schemas
                            - Example
                            - properties
                            - problemField
                          range:
                            start:
                              line: 10
                              character: 8
                            end:
                              line: 10
                              character: 20
                      report:
                        - note: Ej godkända regler - RAP-LP
                          rules:
                            - id: AME.04
                              area: API Message
                              status: EJ OK
        '409':
          description: URL validation is disabled by server configuration.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                featureDisabled:
                  value:
                    type: https://raplp.digg.se/problems/conflict
                    title: Conflict
                    status: 409
                    detail: This feature is currently disabled due to server configuration. Contact your administrator if you think this is a mistake.
                    instance: /api/v1/validation/url
        '500':
          description: Internal server error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                internalServerError:
                  value:
                    type: https://raplp.digg.se/problems/internal-server-error
                    title: Internt serverfel
                    status: 500
                    detail: Ett ovantat fel intraffade.
                    instance: /api/v1/validation/url
  /validation/generate-report:
    post:
      tags:
        - validation
      summary: Generate an Excel report.
      description: Generates an Excel reconciliation report from a precomputed RAP-LP report.
      operationId: generateReport
      requestBody:
        required: true
        description: Precomputed report entries used as input when creating the Excel workbook.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateReportRequest'
            examples:
              precomputedReport:
                value:
                  report:
                    - note: Godkända regler - RAP-LP
                      rules:
                        - id: UFN.05
                          area: URL Format och namngivning
                          status: OK
      responses:
        '200':
          description: Excel report generated successfully.
          headers:
            Content-Disposition:
              description: Indicates attachment download and suggested filename.
              schema:
                type: string
                example: attachment; filename="avstamningsfil.xlsx"
            Content-Type:
              description: Excel media type.
              schema:
                type: string
                example: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet # Yes, we violate rule AME.01, but ok for the purpose ;)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid report input.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                missingReport:
                  value:
                    type: https://raplp.digg.se/problems/bad-request
                    title: Invalid Request
                    status: 400
                    detail: 'Required field missing: report'
                    instance: /api/v1/validation/generate-report
        '500':
          description: Excel report generation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                generationFailed:
                  value:
                    type: https://raplp.digg.se/problems/internal-server-error
                    title: Failed to generate report
                    status: 500
                    detail: Failed to generate report.
                    instance: /api/v1/validation/generate-report
  /statistics/rules:
    get:
      tags:
        - statistics
      summary: Get rule outcome statistics.
      description: |
        Returns how many times each rule has passed (ok) or been violated, together with the number of validations in the period.
        Rules that were not applicable are not recorded.
        `totalOk` is 0 when `onlyViolations` is true, because passed rules are left out.
      operationId: getRuleStatistics
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/OnlyViolations'
      responses:
        '200':
          description: Rule statistics were returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesStatistics'
              examples:
                default:
                  value:
                    enabled: true
                    range:
                      from: '2026-10-01T00:00:00.000Z'
                      to: '2026-11-01T00:00:00.000Z'
                    validations: 31
                    totalViolations: 3
                    totalOk: 10
                    byRule:
                      - ruleId: DOK.03
                        outcome: ok
                        severity: none
                        count: 10
                      - ruleId: DOK.03
                        outcome: violation
                        severity: error
                        count: 3
                disabled:
                  value:
                    enabled: false
                    range: {}
                    validations: 0
                    totalViolations: 0
                    totalOk: 0
                    byRule: []
        '500':
          $ref: '#/components/responses/InternalServerError'
  /statistics/requests:
    get:
      tags:
        - statistics
      summary: Get request statistics per route.
      description: Returns the number of requests per route and method, with average and maximum duration and the number of error responses (status 400 and above).
      operationId: getRequestStatistics
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Request statistics were returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestsStatistics'
              examples:
                default:
                  value:
                    enabled: true
                    range:
                      from: '2026-10-01T00:00:00.000Z'
                    totalRequests: 5
                    byRoute:
                      - route: /api/v1/validation/validatespec
                        method: POST
                        count: 3
                        avgDurationMs: 120
                        maxDurationMs: 547
                        errorCount: 1
        '500':
          $ref: '#/components/responses/InternalServerError'
  /statistics/clients:
    get:
      tags:
        - statistics
      summary: Get request statistics per client.
      description: Returns the number of requests per browser family and operating system. API clients such as curl are reported as non_browser.
      operationId: getClientStatistics
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Client statistics were returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientsStatistics'
              examples:
                default:
                  value:
                    enabled: true
                    range: {}
                    totalRequests: 5
                    byClient:
                      - browserFamily: chrome
                        osFamily: windows
                        count: 4
                      - browserFamily: non_browser
                        osFamily: other
                        count: 1
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health/live:
    get:
      servers:
        - url: https://{host}/
          description: Root of the service, outside the versioned API base path. Defaults to production. Set host to target another environment.
          variables:
            host:
              default: raplp.digg.se
      tags:
        - operations
      summary: Liveness check.
      description: Returns 200 when the service process is running and able to handle requests. Intended for liveness probes.
      operationId: getHealthLive
      responses:
        '200':
          description: The service is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                default:
                  value:
                    status: ok
  /metrics:
    get:
      servers:
        - url: https://{host}/
          description: Root of the service, outside the versioned API base path. Defaults to production. Set host to target another environment.
          variables:
            host:
              default: raplp.digg.se
      tags:
        - operations
      summary: Get Prometheus metrics.
      description: |
        Returns runtime metrics for the service in Prometheus text exposition format.
        The response contains the default Node.js process metrics (process_* and nodejs_*),
        such as CPU time, memory, heap usage, event loop lag and garbage collection.
      operationId: getMetrics
      responses:
        '200':
          description: Metrics were returned.
          content:
            text/plain:
              schema:
                type: string
              examples:
                excerpt:
                  summary: Excerpt of the response showing a counter, gauges, labels and a histogram.
                  value: |
                    # HELP process_cpu_seconds_total Total user and system CPU time spent in seconds.
                    # TYPE process_cpu_seconds_total counter
                    process_cpu_seconds_total 71.844

                    # HELP process_resident_memory_bytes Resident memory size in bytes.
                    # TYPE process_resident_memory_bytes gauge
                    process_resident_memory_bytes 114991104

                    # HELP nodejs_eventloop_lag_p99_seconds The 99th percentile of the recorded event loop delays.
                    # TYPE nodejs_eventloop_lag_p99_seconds gauge
                    nodejs_eventloop_lag_p99_seconds 0.023183359

                    # HELP nodejs_heap_space_size_used_bytes Process heap space size used from Node.js in bytes.
                    # TYPE nodejs_heap_space_size_used_bytes gauge
                    nodejs_heap_space_size_used_bytes{space="new"} 768712
                    nodejs_heap_space_size_used_bytes{space="old"} 33226520
                    nodejs_heap_space_size_used_bytes{space="code"} 6302528

                    # HELP nodejs_gc_duration_seconds Garbage collection duration by kind, one of major, minor, incremental or weakcb.
                    # TYPE nodejs_gc_duration_seconds histogram
                    nodejs_gc_duration_seconds_bucket{le="0.001",kind="major"} 0
                    nodejs_gc_duration_seconds_bucket{le="0.01",kind="major"} 12
                    nodejs_gc_duration_seconds_bucket{le="0.1",kind="major"} 13
                    nodejs_gc_duration_seconds_bucket{le="1",kind="major"} 13
                    nodejs_gc_duration_seconds_bucket{le="2",kind="major"} 13
                    nodejs_gc_duration_seconds_bucket{le="5",kind="major"} 13
                    nodejs_gc_duration_seconds_bucket{le="+Inf",kind="major"} 13
                    nodejs_gc_duration_seconds_sum{kind="major"} 0.07461329999566078
                    nodejs_gc_duration_seconds_count{kind="major"} 13
components:
  parameters:
    From:
      name: from
      in: query
      required: false
      description: |
        Start of the period, inclusive. ISO 8601 date or date-time.
        A date (2026-10-01) is interpreted as UTC. A date-time without Z or offset is interpreted in the server's time zone, so add Z for UTC.
        Invalid values are ignored. Omit for no lower limit.
      schema:
        type: string
        examples:
          - '2026-10-01'
          - '2026-10-01T00:00:00Z'
    To:
      name: to
      in: query
      required: false
      description: |
        End of the period, exclusive. ISO 8601 date or date-time, interpreted as UTC.
        A date (2026-10-01) is interpreted as UTC. A date-time without Z or offset is interpreted in the server's time zone, so add Z for UTC.
        Invalid values are ignored. Omit for no upper limit.
      schema:
        type: string
        examples:
          - '2026-11-01'
    OnlyViolations:
      name: onlyViolations
      in: query
      required: false
      description: When true, only rows with outcome violation are returned. Only the exact value true enables the filter.
      schema:
        type: boolean
        default: false
  responses:
    InternalServerError:
      description: Internal server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            internalServerError:
              value:
                type: https://raplp.digg.se/problems/internal-server-error
                title: Internt serverfel
                status: 500
                detail: Ett ovantat fel intraffade.
                instance: /api/v1/statistics/rules
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      description: Health status of the service.
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
      required:
        - status
    ValidationRules:
      type: array
      description: Available rule categories.
      items:
        $ref: '#/components/schemas/ValidationRule'
    ValidationRule:
      type: object
      additionalProperties: false
      properties:
        rule:
          type: string
          description: Rule category identifier.
          example: UfnRules
        description:
          type: string
          description: Human-readable description of the rule category.
          example: URL format och namngivning
      required:
        - rule
        - description
    SpecValidationRequest:
      type: object
      additionalProperties: false
      properties:
        spec:
          type: string
          description: Base64-encoded OpenAPI specification content.
        strict:
          type: boolean
          description: Enables strict parsing and semantic validation before RAP-LP rules are executed.
          default: true
        categories:
          type: array
          description: Optional subset of rule categories to execute.
          items:
            type: string
          examples:
            - [DokRules, UfnRules]
      required:
        - spec
    UrlValidationRequest:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Absolute URL pointing to a remotely hosted OpenAPI specification.
        strict:
          type: boolean
          description: Enables strict parsing and semantic validation before RAP-LP rules are executed.
          default: true
        categories:
          type: array
          description: Optional subset of rule categories to execute. If omitted, all categories are used and ForRules is added implicitly by the service.
          items:
            type: string
          examples:
            - [DokRules, UfnRules]
      required:
        - url
    ApiInfo:
      type: object
      additionalProperties: false
      properties:
        apiName:
          type: string
          example: RAP-LP API
        _links:
          type: object
          properties:
            self:
              type: object
              properties:
                href:
                  type: string
            rules:
              type: object
              properties:
                href:
                  type: string
        apiVersion:
          type: string
          description: Semantic version of this API.
          example: 1.2.3
        apiReleased:
          type: string
          format: date
          example: '2026-12-24'
        apiDocumentation:
          type: string
          format: uri
          example: https://raplp.digg.se/api/v1/docs
        apiStatus:
          type: string
          example: active
      required:
        - apiName
        - apiVersion
        - apiReleased
        - apiDocumentation
        - apiStatus
    ValidationResult:
      type: object
      additionalProperties: false
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/RapLpDiagnosticItem'
        report:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticReport'
      required:
        - result
        - report
    SuccessfulValidationResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
        stage:
          $ref: '#/components/schemas/ValidationStage'
        format:
          $ref: '#/components/schemas/SpecFormat'
        payload:
          $ref: '#/components/schemas/ValidationResult'
      required:
        - ok
        - stage
        - format
        - payload
    UrlValidationSuccessResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
        stage:
          type: string
          enum:
            - rule-engine
          description: Processing stage that produced the successful response.
        format:
          $ref: '#/components/schemas/SpecFormat'
        payload:
          $ref: '#/components/schemas/ValidationResult'
      required:
        - ok
        - stage
        - format
        - payload
    SpecFormat:
      type: string
      description: Parsed OpenAPI document format.
      enum:
        - yaml
        - json
      example: yaml
    ValidationStage:
      type: string
      description: Validation stage that produced the response.
      enum:
        - strict
        - rule-engine
      example: rule-engine
    ProblemDetails:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
      required:
        - type
        - title
        - status
        - detail
        - instance
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          additionalProperties: true
          properties:
            kind:
              type: string
              enum:
                - spec-validation
                - rule-validation
            stage:
              $ref: '#/components/schemas/ValidationStage'
            format:
              $ref: '#/components/schemas/SpecFormat'
            issues:
              type: array
              items:
                $ref: '#/components/schemas/StrictIssue'
            snippet:
              type: string
            payload:
              $ref: '#/components/schemas/ValidationResult'
    StrictIssue:
      type: object
      additionalProperties: true
      properties:
        code:
          type: string
        message:
          type: string
        severity:
          type: string
        path:
          type: array
          items:
            type: string
      required:
        - message
    RapLpDiagnosticItem:
      type: object
      additionalProperties: true
      properties:
        id:
          type: string
          nullable: true
        area:
          type: string
          nullable: true
        requirement:
          type: string
          nullable: true
        severity:
          type: string
          nullable: true
          enum:
            - HINT
            - INFORMATION
            - WARNING
            - ERROR
        path:
          type: array
          items:
            type: string
          nullable: true
        range:
          $ref: '#/components/schemas/Range'
        tags:
          type: array
          items:
            type: string
        relatedInformation:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticRelatedInformation'
    DiagnosticRelatedInformation:
      type: object
      additionalProperties: false
      properties:
        location:
          $ref: '#/components/schemas/Location'
        message:
          type: string
      required:
        - location
        - message
    Location:
      type: object
      additionalProperties: false
      properties:
        uri:
          type: string
          nullable: true
        range:
          $ref: '#/components/schemas/Range'
      required:
        - range
    Range:
      type: object
      additionalProperties: false
      properties:
        start:
          $ref: '#/components/schemas/Position'
        end:
          $ref: '#/components/schemas/Position'
      required:
        - start
        - end
    Position:
      type: object
      additionalProperties: false
      properties:
        line:
          type: integer
          minimum: 0
        character:
          type: integer
          minimum: 0
      required:
        - line
        - character
    DiagnosticRuleInfo:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          example: UFN.05
        area:
          type: string
          example: URL Format och namngivning
      required:
        - id
        - area
    PopulatedDiagnosticRuleInfo:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          example: UFN.05
        area:
          type: string
          example: URL Format och namngivning
        helpUrl:
          type: string
          format: uri
        requirement:
          type: string
        status:
          type: string
          example: OK
      required:
        - id
        - area
        - status
    DiagnosticReport:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          example: Godkända regler - RAP-LP
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PopulatedDiagnosticRuleInfo'
      required:
        - note
        - rules
    GenerateReportRequest:
      type: object
      additionalProperties: false
      properties:
        report:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticReport'
      required:
        - report
    StatisticsRange:
      type: object
      additionalProperties: false
      description: The period the statistics cover. Only the limits that were requested are included, so the object is empty when no period was given.
      properties:
        from:
          type: string
          format: date-time
          description: Start of the period, inclusive.
          example: '2026-10-01T00:00:00.000Z'
        to:
          type: string
          format: date-time
          description: End of the period, exclusive.
          example: '2026-11-01T00:00:00.000Z'
    RuleStatisticsRow:
      type: object
      additionalProperties: false
      properties:
        ruleId:
          type: string
          example: DOK.03
        outcome:
          type: string
          enum:
            - ok
            - violation
        severity:
          type: string
          description: Lowercase severity of a violation (for example error or warning). none for passed rules.
          example: error
        count:
          type: integer
          minimum: 0
          description: Number of occurrences of the outcome.
      required:
        - ruleId
        - outcome
        - severity
        - count
    RulesStatistics:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: False when statistics are disabled or could not be started.
        range:
          $ref: '#/components/schemas/StatisticsRange'
        validations:
          type: integer
          minimum: 0
          description: Number of distinct validations in the period that reached the rule engine. Requests stopped by strict validation or invalid input are not counted.
        totalViolations:
          type: integer
          minimum: 0
          description: Sum of violations. A rule can be violated several times in one validation.
        totalOk:
          type: integer
          minimum: 0
          description: Sum of passed rules.
        byRule:
          type: array
          items:
            $ref: '#/components/schemas/RuleStatisticsRow'
      required:
        - enabled
        - range
        - validations
        - totalViolations
        - totalOk
        - byRule
    RequestStatisticsRow:
      type: object
      additionalProperties: false
      properties:
        route:
          type: string
          description: Route pattern, or unmatched when no route matched.
          example: /api/v1/validation/validatespec
        method:
          type: string
          example: POST
        count:
          type: integer
          minimum: 0
        avgDurationMs:
          type: number
        maxDurationMs:
          type: integer
          minimum: 0
        errorCount:
          type: integer
          minimum: 0
          description: Number of responses with status 400 or above.
      required:
        - route
        - method
        - count
        - avgDurationMs
        - maxDurationMs
        - errorCount
    RequestsStatistics:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: False when statistics are disabled or could not be started.
        range:
          $ref: '#/components/schemas/StatisticsRange'
        totalRequests:
          type: integer
          minimum: 0
        byRoute:
          type: array
          items:
            $ref: '#/components/schemas/RequestStatisticsRow'
      required:
        - enabled
        - range
        - totalRequests
        - byRoute
    ClientStatisticsRow:
      type: object
      additionalProperties: false
      properties:
        browserFamily:
          type: string
          enum:
            - chrome
            - firefox
            - safari
            - edge
            - other
            - non_browser
        osFamily:
          type: string
          enum:
            - windows
            - macos
            - linux
            - android
            - ios
            - other
        count:
          type: integer
          minimum: 0
      required:
        - browserFamily
        - osFamily
        - count
    ClientsStatistics:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: False when statistics are disabled or could not be started.
        range:
          $ref: '#/components/schemas/StatisticsRange'
        totalRequests:
          type: integer
          minimum: 0
        byClient:
          type: array
          items:
            $ref: '#/components/schemas/ClientStatisticsRow'
      required:
        - enabled
        - range
        - totalRequests
        - byClient
